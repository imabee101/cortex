[package]
license = "Apache-2.0"
name = "cortex-cloud-config"
version = "0.1.0"
edition.workspace = true
description = "Fetches Cortex cloud settings, keeps them in a signed cache, and refreshes them mid-session"

[features]
# Exposes the test-only functions in `settings_get` to downstream test targets.
test-support = []
default-bazel = ["test-support"]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
globset = { workspace = true }
indexmap = { workspace = true }
fs2 = { workspace = true }
hmac = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
reqwest = { workspace = true, features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
cortex-dirs = { workspace = true }
cortex-config = { workspace = true }
cortex-env = { workspace = true }
cortex-extra-ca = { workspace = true }
cortex-http = { workspace = true }
cortex-login = { workspace = true }
cortex-telemetry = { workspace = true }
cortex-version = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
futures = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net"] }
toml = { workspace = true }
cortex-login = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
