[package]
license = "Apache-2.0"
name = "cortex-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the cortex CLI, extracted from cortex-shell for dependency inversion."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
cortex-config = { workspace = true }
cortex-sandbox = { path = "../cortex-sandbox", default-features = false }

[features]
default-bazel = []

[lints]
workspace = true
