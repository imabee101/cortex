[package]
license = "Apache-2.0"
name = "cortex-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
cortex-hooks = { path = "../cortex-hooks" }
cortex-sampling-types = { path = "../cortex-sampling-types" }
cortex-telemetry = { workspace = true }
cortex-tools = { path = "../cortex-tools" }
cortex-tty-utils = { workspace = true }
cortex-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
ignore = { workspace = true }
cortex-config = { workspace = true }
cortex-dirs = { workspace = true }
cortex-permission-rules = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
cortex-tool-types.workspace = true

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
