[package]
license = "Apache-2.0"
name = "cortex-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for Cortex agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
cortex-compaction-transcript = { workspace = true }
cortex-compaction = { path = "../../common/cortex-compaction" }
cortex-sampling-types = { path = "../cortex-sampling-types" }
cortex-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
