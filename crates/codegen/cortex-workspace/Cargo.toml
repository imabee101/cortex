[package]
license = "Apache-2.0"
name = "cortex-workspace"
version = "0.1.220-alpha.4"
edition.workspace = true
description = "Core host-local workspace library (FS, VCS, execution, discovery) for cortex-shell and remote sampler"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
dunce = { workspace = true }
cortex-version = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
parking_lot = { workspace = true }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ignore = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
cortex-agent = { path = "../cortex-agent" }
cortex-tools = { path = "../cortex-tools" }
cortex-tools-api = { path = "../cortex-tools-api" }
# `DiagHandle`, held by the hub config and threaded through `connect_hub`.
cortex-diag-server = { workspace = true }
# Pre-stop lifecycle broker served on the diagnostics socket by `bin/workspace_server.rs`.
cortex-lifecycle = { workspace = true }
cortex-workspace-client = { path = "../cortex-workspace-client" }
# Daemon/process-lifecycle machinery for `bin/workspace_server.rs` only; the
# library never references it.
cortex-workspace-daemon = { path = "../cortex-workspace-daemon" }
cortex-workspace-types = { path = "../cortex-workspace-types" }
cortex-config = { workspace = true }
cortex-dirs = { workspace = true }
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
cortex-config-types = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
dashmap = { workspace = true }
agent-client-protocol = { workspace = true }
cortex-acp-lib = { workspace = true }
cortex-codebase-graph = { path = "../cortex-codebase-graph" }
cortex-paths = { path = "../cortex-paths" }
cortex-permission-rules = { workspace = true }
base64 = { workspace = true }
infer = { workspace = true }
sha2 = { workspace = true, features = ["force-soft"] }
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
# Backs `file_system`'s fuzzy path picker (matcher + background daemon).
cortex-fuzzy-file-search = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { workspace = true }
chrono = { workspace = true }
tree-sitter = { workspace = true }
url = { workspace = true }
cortex-env = { workspace = true }
humantime-serde = { workspace = true }
prometheus = { workspace = true }
cortex-egress-proxy = { path = "../cortex-egress-proxy" }
cortex-sandbox = { path = "../cortex-sandbox", default-features = false }
cortex-hooks = { path = "../cortex-hooks" }
cortex-hunk-tracker = { path = "../cortex-hunk-tracker" }
# `metrics` enables the SDK's metric-donation client (periodic Prometheus
# registry gather → OTLP → hub donation pump); see metric_donation_reporter.
cortex-computer-hub-sdk = { workspace = true, features = ["metrics"] }
cortex-computer-hub-mcp-adapter = { path = "../../common/cortex-computer-hub-mcp-adapter" }
cortex-mcp = { path = "../cortex-mcp" }
cortex-file-utils = { path = "../cortex-file-utils" }
cortex-session-events = { workspace = true }
cortex-auth = { path = "../cortex-auth" }
cortex-telemetry = { workspace = true }
cortex-tty-utils = { workspace = true }
reqwest = { workspace = true }
cortex-tool-protocol = { workspace = true }
cortex-tool-runtime = { workspace = true }
cortex-tool-types = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
urlencoding = "2"
cortex-fast-worktree = { path = "../cortex-fast-worktree", features = ["metadata"] }
# tonic: Status/Code mapping for deploy errors in workspace_ops.
tonic = { workspace = true }
sha1 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

cortex-fsnotify = { path = "../cortex-fsnotify" }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
# "enable" required for the SDK's spans to record at all.
fastrace = { workspace = true, features = ["enable"] }
cortex-tracing = { workspace = true }
cortex-extra-ca = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tempfile = { workspace = true }
zstd = { workspace = true }
wait-timeout = { workspace = true }

# Raw fd/dirent/poll calls in foreign-session capability probes, the fuzzy
# walker's rlimit guard, and the envrc reader.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[[bin]]
name = "cortex-workspace-server"
path = "src/bin/workspace_server.rs"

[[bin]]
name = "workspace-server-probe"
path = "src/bin/workspace_server_probe.rs"

[features]
default = ["sandbox-enforce"]
compression = []
test-support = []
test-util = []
sandbox-enforce = ["cortex-sandbox/enforce"]
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
cortex-test-utils = { path = "../../common/cortex-test-utils" }
# Decode tar.gz archives produced by workspace upload helpers in tests.
flate2 = { workspace = true }
tar = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]

[lints]
workspace = true
